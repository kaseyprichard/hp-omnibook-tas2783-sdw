# tas2783 specific switch control settings.
# The 7.2.2 sof_sdw machine driver exposes kcontrols named "Left Spk Switch"
# etc. (amixer sget shows them as simple control "Left Spk", which misled 0018).

BootSequence [
	cset "name='Left Spk Switch' on"
	cset "name='Right Spk Switch' on"
	cset "name='Left Spk2 Switch' on"
	cset "name='Right Spk2 Switch' on"
]
